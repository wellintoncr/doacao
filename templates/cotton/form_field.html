<div class="field{% if field.errors %} error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
    {{ field }}
    {% for error in field.errors %}
    <p class="help">{{ error }}</p>
    {% endfor %}
    {% if field.help_text %}
    <p class="help">{{ field.help_text }}</p>
    {% endif %}
</div>

{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-emotion="neutral" data-color="green">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Doação{% endblock %}</title>
    <meta name="theme-color" content="#F7F8F9">
    <meta name="description" content="Organize a doação semanal do grupo">
    <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">
    <link rel="shortcut icon" href="{% static 'icons/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script src="{% static 'js/htmx.min.js' %}"></script>
    {% block head_js %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="{% url 'event-detail' %}" class="brand">Doação</a>
            <a href="{% url 'profile' %}" id="profile-link" class="btn btn-ghost btn-sm">Perfil</a>
        </div>
    </header>
    <main class="wrap">
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'js/app.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>

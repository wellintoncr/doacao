{% extends "base.html" %}
{% load static %}

{% block title %}Perfil — Doação{% endblock %}

{% block content %}
<div class="masthead">
    <span class="eyebrow">Perfil</span>
    <h1 class="title">Quem é você?</h1>
    <p class="lead">Seu nome aparece ao lado do que você prometeu levar.</p>
</div>
<form id="profile-form" class="card stack form-page" data-next="{% url 'event-detail' %}">
    <div class="field">
        <label for="profile-name">Seu nome</label>
        <input class="inp" type="text" id="profile-name" maxlength="60" required placeholder="Seu nome">
    </div>
    <div class="row">
        <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
</form>
{% endblock %}

{% block extra_js %}<script src="{% static 'js/profile.js' %}"></script>{% endblock %}
